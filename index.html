<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groove — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0d12; --panel:#18151d; --panel2:#211d28; --line:#2e2938;
    --text:#f3eee6; --muted:#9a92a6; --accent:#ff7a45; --accent2:#ffc857; --bad:#ff5d73;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 600px at 20% -10%,#2a1a24 0%,transparent 60%),var(--bg);
    color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;padding:24px;min-height:100%}
  .app{width:100%;max-width:1000px;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-content:start}
  @media (max-width:820px){.app{grid-template-columns:1fr}body{padding:12px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-weight:700;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
  .logo span{display:inline-block;width:28px;height:28px;border-radius:50%;
    background:conic-gradient(var(--accent),var(--accent2),var(--accent));box-shadow:0 0 24px #ff7a4560}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;
    padding:10px 16px;font:inherit;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#1a0f0a;border-color:var(--accent);font-weight:700}
  .btn.primary:hover{filter:brightness(1.1);color:#1a0f0a}
  .btn:disabled{opacity:.5;cursor:default}

  /* Player */
  .player{display:flex;flex-direction:column;gap:18px}
  .art{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#2b1d33,#1a1420)}
  .art.isvideo{aspect-ratio:16/10;background:#000}
  .art canvas{position:absolute;inset:0;width:100%;height:100%}
  .art video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
  .art.isvideo video.active{display:block}
  .art.isvideo canvas,.art.isvideo .disc{display:none}
  .fs{position:absolute;right:10px;bottom:10px;z-index:2;display:none;background:#000a;border:none;color:#fff;
    width:36px;height:36px;border-radius:10px;cursor:pointer}
  .fs svg{width:20px;height:20px;fill:currentColor}
  .art.isvideo .fs{display:grid;place-items:center}
  .disc{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1c1c1c 2px 4px);
    box-shadow:0 10px 40px #0009;display:flex;align-items:center;justify-content:center}
  .disc::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,var(--bg) 0 12%,var(--accent) 13% 60%,var(--accent2) 61%)}
  .playing .disc{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .meta h2{font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta p{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seek{display:flex;flex-direction:column;gap:6px}
  .times{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;
    background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));cursor:pointer;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);border:none}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:none}
  .controls{display:flex;align-items:center;justify-content:center;gap:14px}
  .ic{background:none;border:none;color:var(--text);cursor:pointer;width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;transition:.15s}
  .ic:hover{background:var(--panel2)}
  .ic.on{color:var(--accent)}
  .ic svg{width:22px;height:22px;fill:currentColor}
  .play{width:66px;height:66px;background:var(--text);color:var(--bg)}
  .play:hover{background:var(--accent);color:#1a0f0a}
  .play svg{width:28px;height:28px}
  .vol{display:flex;align-items:center;gap:10px;color:var(--muted)}
  .vol svg{width:20px;height:20px;fill:currentColor;flex:none}
  .badge{position:relative}
  .badge small{position:absolute;bottom:6px;right:6px;font-size:9px;font-weight:700}

  /* Library */
  .lib{display:flex;flex-direction:column;gap:14px;min-height:0}
  .lib-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .lib-head h3{font-size:18px}
  .count{color:var(--muted);font-size:13px}
  .field{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;outline:none;min-width:0}
  .field:focus{border-color:var(--accent)}
  .linkrow{display:flex;gap:8px}
  .linkrow .btn{border-radius:12px}
  .prog{display:none;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
  .prog.show{display:flex}
  .prog .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
  .prog .bar.indet i{width:30%;animation:ind 1.1s ease-in-out infinite}
  @keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
  .drop{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:14px;transition:.15s;cursor:pointer}
  .drop.over{border-color:var(--accent);color:var(--accent);background:#ff7a4510}
  ul.list{list-style:none;overflow:auto;max-height:420px;display:flex;flex-direction:column;gap:4px;padding-right:4px}
  ul.list::-webkit-scrollbar{width:6px} ul.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .item{display:grid;grid-template-columns:28px 1fr auto auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item.active{background:linear-gradient(90deg,#ff7a4522,transparent)}
  .item.active .t{color:var(--accent)}
  .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center}
  .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
  .tag{font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--accent2);flex:none}
  .dur{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .act{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;width:24px;height:24px;display:grid;place-items:center}
  .act svg{width:16px;height:16px;fill:currentColor}
  .item:hover .act{opacity:1} .act:hover{color:var(--accent)}
  @media (hover:none){.act{opacity:1}}
  .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
  .bars i{width:3px;background:var(--accent);animation:b 0.9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,100%{height:3px}50%{height:14px}}
  .paused .bars i{animation-play-state:paused}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
  .keys{color:var(--muted);font-size:12px;text-align:center;line-height:1.9}
  kbd{font-family:'JetBrains Mono',monospace;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--text);
    padding:12px 16px;border-radius:12px;max-width:min(520px,92vw);font-size:14px;line-height:1.4;transition:.25s;z-index:10;box-shadow:0 10px 30px #0008}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.bad{border-left-color:var(--bad)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><span></span>Groove</div>
    <button class="btn primary" id="addBtn">+ Add files</button>
    <input type="file" id="file" accept="audio/*,video/*" multiple hidden>
  </header>

  <section class="card player" id="player">
    <div class="art" id="art">
      <canvas id="viz"></canvas><div class="disc"></div>
      <video id="vA" playsinline crossorigin="anonymous"></video>
      <video id="vB" playsinline></video>
      <button class="fs" id="fsBtn" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
    <div class="meta"><h2 id="title">Nothing playing</h2><p id="artist">Add songs, paste a link, or pick a demo track</p></div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="ic" id="shuffle" title="Shuffle (S)"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg></button>
      <button class="ic" id="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ic play" id="play" title="Play/Pause (Space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic" id="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ic badge" id="repeat" title="Repeat (R)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><small id="rep1"></small></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24" id="muteBtn" style="cursor:pointer"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </section>

  <section class="card lib">
    <div class="lib-head"><h3>Library</h3><span class="count" id="count"></span></div>
    <form class="linkrow" id="linkForm">
      <input class="field" id="linkInput" type="url" placeholder="Paste a link to an audio or video file…" autocomplete="off">
      <button class="btn primary" id="linkBtn" type="submit">Add</button>
    </form>
    <div class="prog" id="prog"><span id="progText">Downloading…</span><div class="bar" id="progBar"><i id="progFill"></i></div></div>
    <div class="drop" id="drop">Drop audio or video files here, or click to browse</div>
    <input class="field" id="search" placeholder="Search your library…">
    <ul class="list" id="list"></ul>
    <div class="keys"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> skip · <kbd>↑</kbd><kbd>↓</kbd> volume · <kbd>S</kbd> shuffle · <kbd>R</kbd> repeat · <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen</div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const vA = $('vA');   // routed through Web Audio (local files, downloads, demos) → visualizer
const vB = $('vB');   // plain element for links that only allow streaming
let media = vA;
let tracks = [];      // {id,title,artist,kind,added,blob,link,url,duration,demo}
let order = [];
let cur = -1, shuffle = false, repeat = 0; // repeat: 0 off, 1 all, 2 one
let ctx, analyser, data;

const fmt = s => { if(!isFinite(s)||s<0) return '0:00'; s=Math.floor(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0'); return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`; };
const fmtSize = b => b>1e9?(b/1e9).toFixed(2)+' GB':b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const setFill = el => el.style.setProperty('--p', (el.value-el.min)/(el.max-el.min)*100+'%');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let toastT;
function toast(msg, bad=false, ms=4500){
  const t=$('toast'); t.textContent=msg; t.classList.toggle('bad',bad); t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms);
}

/* ---------- Saved library (IndexedDB) ---------- */
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('groove',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'});
  r.onsuccess=()=>{db=r.result;res(db)}; r.onerror=()=>res(null);}catch(e){res(null)}})}
function dbReq(mode,fn){return new Promise(res=>{if(!db)return res(null);try{
  const tx=db.transaction('tracks',mode),st=tx.objectStore('tracks'),r=fn(st);let out=null;
  if(r) r.onsuccess=()=>{out=r.result};
  tx.oncomplete=()=>res(out===null&&mode==='readwrite'?true:out); tx.onerror=tx.onabort=()=>res(null);
}catch(e){res(null)}})}
const dbPut = rec => dbReq('readwrite',st=>{st.put(rec)});
const dbDel = id  => dbReq('readwrite',st=>{st.delete(id)});
const dbAll = ()  => dbReq('readonly', st=>st.getAll());
function saveTrack(t){
  return dbPut({id:t.id,title:t.title,artist:t.artist,kind:t.kind,added:t.added,duration:t.duration,blob:t.blob||null,link:t.link||null});
}

/* ---------- Demo tracks synthesized in the browser ---------- */
function wavFromBuffer(buf){
  const ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate;
  const ab=new ArrayBuffer(44+len*ch*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+len*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);
  v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);
  const chans=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let o=44;
  for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,chans[c][i]));v.setInt16(o,x<0?x*0x8000:x*0x7fff,true);o+=2}
  return new Blob([ab],{type:'audio/wav'});
}
const midi=n=>440*Math.pow(2,(n-69)/12);
async function renderDemo({bpm,bars,chords,lead,wave,kick=true,hat=true}){
  const sr=22050,beat=60/bpm,dur=bars*4*beat+1.5;
  const oc=new OfflineAudioContext(2,Math.ceil(sr*dur),sr);
  const master=oc.createGain();master.gain.value=.5;
  const comp=oc.createDynamicsCompressor();master.connect(comp);comp.connect(oc.destination);
  const note=(f,t,len,type,vol,pan=0)=>{const o=oc.createOscillator(),g=oc.createGain(),p=oc.createStereoPanner();
    o.type=type;o.frequency.value=f;p.pan.value=pan;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(p);p.connect(master);o.start(t);o.stop(t+len+.05);};
  const nb=oc.createBuffer(1,sr*.2,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  for(let bar=0;bar<bars;bar++){const ch=chords[bar%chords.length];
    for(let b=0;b<4;b++){const t=(bar*4+b)*beat;
      if(b===0)ch.forEach((n,i)=>note(midi(n),t,beat*4,wave,.07,(i-1)*.4));
      note(midi(ch[0]-12),t,beat*.9,'triangle',.25);
      if(kick){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
        g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35);}
      if(hat)[0,.5].forEach(off=>{const s=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;
        g.gain.setValueAtTime(.12,t+off*beat);g.gain.exponentialRampToValueAtTime(.001,t+off*beat+.05);s.connect(f);f.connect(g);g.connect(master);s.start(t+off*beat);});
      const ln=lead[(bar*4+b)%lead.length];if(ln)note(midi(ln),t,beat*.8,'square',.05,.3);}}
  return wavFromBuffer(await oc.startRendering());
}
const demos=[
  {title:'Sunset Drive',cfg:{bpm:100,bars:16,wave:'sawtooth',chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],lead:[69,0,72,71,69,0,67,64,65,0,69,67,64,0,62,64]}},
  {title:'Night Market',cfg:{bpm:124,bars:16,wave:'square',chords:[[50,53,57],[50,53,57],[46,50,53],[48,52,55]],lead:[74,74,0,77,76,0,74,72,74,0,0,69,72,74,0,0]}},
  {title:'Slow Tide',cfg:{bpm:76,bars:12,wave:'sine',kick:false,chords:[[52,55,59],[48,52,55],[55,59,62],[50,54,57]],lead:[71,0,0,72,0,74,0,0,76,0,74,0]}},
];

/* ---------- Helpers for new media ---------- */
function parseName(name){
  const base=name.replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[_+]/g,' ').trim()||'Untitled';
  const m=base.split(/\s+-\s+/);
  return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'Unknown artist',title:base};
}
// Load just the metadata to learn duration and whether it has a picture (video) or not (audio)
function probe(url){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.preload='metadata'; v.muted=true;
    const done=(fn,x)=>{clearTimeout(to);v.onloadedmetadata=v.onerror=null;v.removeAttribute('src');try{v.load()}catch(e){}fn(x)};
    const to=setTimeout(()=>done(rej,new Error('timeout')),25000);
    v.onloadedmetadata=()=>done(res,{duration:v.duration,video:v.videoWidth>0});
    v.onerror=()=>done(rej,new Error('unplayable'));
    v.src=url;
  });
}
function showProg(text,frac){
  $('prog').classList.add('show'); $('progText').textContent=text;
  const bar=$('progBar'); bar.classList.toggle('indet',frac==null);
  $('progFill').style.width=frac==null?'':(frac*100).toFixed(1)+'%';
}
const hideProg=()=>$('prog').classList.remove('show');

async function addTrack(t, startPlaying){
  tracks.push(t); rebuildOrder(); render();
  if(!t.demo){ const ok=await saveTrack(t);
    if(!ok) toast(`"${t.title}" will play now but couldn't be saved for next time (browser storage full or unavailable).`,true); }
  if(startPlaying && (cur<0||media.paused)) playIndex(tracks.indexOf(t));
}

/* ---------- Adding files from the device ---------- */
async function addFiles(files){
  const list=[...files].filter(f=>/^(audio|video)\//.test(f.type)||/\.(mp3|wav|ogg|oga|m4a|flac|aac|opus|weba|webm|mp4|m4v|mov|mkv|ogv)$/i.test(f.name));
  if(!list.length){toast('Those files aren\'t audio or video.',true);return;}
  let first=true;
  for(const f of list){
    const url=URL.createObjectURL(f);
    try{
      const info=await probe(url);
      const {artist,title}=parseName(f.name);
      await addTrack({id:uid(),title,artist,kind:info.video?'video':'audio',added:Date.now(),blob:f,url,duration:info.duration},first);
      first=false;
    }catch(e){URL.revokeObjectURL(url);toast(`Your browser can't play "${f.name}".`,true);}
  }
}
$('addBtn').onclick=()=>$('file').click();
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)drop.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');
  if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  else{const u=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');if(u)addLink(u);}});

/* ---------- Adding from a link ---------- */
const PAGE_SITES=/(^|\.)(youtube\.com|youtu\.be|music\.youtube\.com|spotify\.com|soundcloud\.com|music\.apple\.com|deezer\.com|tidal\.com|instagram\.com|tiktok\.com|facebook\.com|fb\.watch|x\.com|twitter\.com|vimeo\.com|jiosaavn\.com|gaana\.com|wynk\.in|anghami\.com|audiomack\.com)$/i;

async function fetchWithProgress(url){
  const r=await fetch(url,{mode:'cors'});
  if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{http:r.status});
  const type=(r.headers.get('content-type')||'').split(';')[0].trim();
  if(/^text\/html|^application\/json/.test(type)) throw Object.assign(new Error('page'),{page:true});
  const total=+r.headers.get('content-length')||0;
  if(!r.body){const b=await r.blob();return b;}
  const reader=r.body.getReader(),chunks=[];let got=0;
  for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;
    showProg(total?`Downloading… ${fmtSize(got)} of ${fmtSize(total)}`:`Downloading… ${fmtSize(got)}`, total?got/total:null);}
  return new Blob(chunks,{type:type||'application/octet-stream'});
}

let busy=false;
async function addLink(raw){
  let u; try{u=new URL(raw.trim());}catch(e){toast('That doesn\'t look like a link. Paste the full address, starting with https://',true);return;}
  if(!/^https?:$/.test(u.protocol)){toast('Only http and https links are supported.',true);return;}
  if(PAGE_SITES.test(u.hostname)){
    toast(`${u.hostname.replace(/^www\./,'')} links can't be added. They open a web page rather than an audio or video file, and those sites don't allow downloads. Use a direct link to a file instead, for example one ending in .mp3 or .mp4.`,true,8000);return;}
  if(busy){toast('Still adding the last link. Please wait a moment.');return;}
  busy=true; $('linkBtn').disabled=true;
  const seg=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname);
  const {artist,title}=parseName(seg);
  showProg('Connecting…',null);
  try{
    // 1) Try to download the whole file so it's saved in the library
    const blob=await fetchWithProgress(u.href);
    showProg('Checking file…',null);
    const url=URL.createObjectURL(blob);
    let info; try{info=await probe(url);}catch(e){URL.revokeObjectURL(url);throw Object.assign(new Error('bad'),{bad:true});}
    await addTrack({id:uid(),title,artist:artist==='Unknown artist'?u.hostname.replace(/^www\./,''):artist,kind:info.video?'video':'audio',
      added:Date.now(),blob,url,duration:info.duration},true);
    toast(`Downloaded "${title}" (${fmtSize(blob.size)}). It's saved in your library.`);
    $('linkInput').value='';
  }catch(e){
    if(e.page){toast('That link opens a web page, not an audio or video file. Try a direct link to the file.',true,7000);}
    else if(e.bad){toast('That file downloaded, but your browser can\'t play its format.',true,7000);}
    else if(e.http===404){toast('Nothing was found at that link (error 404).',true);}
    else{
      // 2) The site doesn't allow downloading (CORS) — try streaming it instead
      showProg('This site doesn\'t allow downloads. Trying to stream it instead…',null);
      try{
        const info=await probe(u.href);
        await addTrack({id:uid(),title,artist:artist==='Unknown artist'?u.hostname.replace(/^www\./,''):artist,kind:info.video?'video':'audio',
          added:Date.now(),link:u.href,url:u.href,duration:info.duration},true);
        toast(`Added "${title}" for online play. This site doesn't allow downloads, so it needs internet to play and the visualizer will be idle.`,false,7000);
        $('linkInput').value='';
      }catch(e2){
        toast('Couldn\'t load that link. Check that it opens an audio or video file directly and is publicly reachable.',true,7000);
      }
    }
  }finally{hideProg();busy=false;$('linkBtn').disabled=false;}
}
$('linkForm').onsubmit=e=>{e.preventDefault();const v=$('linkInput').value;if(v.trim())addLink(v);};
$('linkInput').addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');
  if(/^https?:\/\/\S+$/.test(t.trim())){e.preventDefault();$('linkInput').value=t.trim();addLink(t);}});

/* ---------- Playback ---------- */
function rebuildOrder(){
  order=tracks.map((_,i)=>i);
  if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    if(cur>=0){order.splice(order.indexOf(cur),1);order.unshift(cur);}}
}
function initAudioGraph(){
  if(ctx) return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaElementSource(vA);
    analyser=ctx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;
    data=new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);analyser.connect(ctx.destination);
  }catch(e){ctx=null;}
}
async function playIndex(i){
  if(i<0||i>=tracks.length) return;
  initAudioGraph(); if(ctx&&ctx.state==='suspended') ctx.resume();
  cur=i; const t=tracks[i];
  if(!t.url && t.demo){
    $('title').textContent=t.title;$('artist').textContent='Rendering demo…';
    t.blob=await renderDemo(t.demo); t.url=URL.createObjectURL(t.blob);
  }
  if(!t.url && t.blob) t.url=URL.createObjectURL(t.blob);
  const next = t.link ? vB : vA;       // streamed links can't go through Web Audio
  const other = next===vA ? vB : vA;
  other.pause(); other.removeAttribute('src'); other.load(); other.classList.remove('active');
  media=next; media.classList.add('active');
  $('art').classList.toggle('isvideo',t.kind==='video');
  media.src=t.url;
  try{await media.play();}catch(e){}
  updateNow(); render();
}
function togglePlay(){
  if(cur<0){ if(tracks.length) playIndex(order[0]); return; }
  initAudioGraph(); if(ctx&&ctx.state==='suspended') ctx.resume();
  media.paused?media.play().catch(()=>{}):media.pause();
}
function step(dir){
  if(!tracks.length) return;
  if(dir<0 && media.currentTime>3){media.currentTime=0;return;}
  let pos=order.indexOf(cur)+dir;
  if(pos>=order.length){ if(repeat===1){ if(shuffle) rebuildOrder(); pos=0;} else {media.pause();media.currentTime=0;return;} }
  if(pos<0) pos=repeat===1?order.length-1:0;
  playIndex(order[pos]);
}
let seeking=false;
[vA,vB].forEach(el=>{
  el.addEventListener('ended',()=>{if(el!==media)return; if(repeat===2){el.currentTime=0;el.play();} else step(1);});
  const ps=()=>{ if(el!==media) return; const p=!el.paused;
    $('player').classList.toggle('playing',p); document.body.classList.toggle('paused',!p);
    $('playIcon').innerHTML=p?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    if('mediaSession' in navigator) navigator.mediaSession.playbackState=p?'playing':'paused'; };
  el.addEventListener('play',ps); el.addEventListener('pause',ps);
  el.addEventListener('loadedmetadata',()=>{ if(el!==media||cur<0) return; $('dur').textContent=fmt(el.duration);
    const t=tracks[cur]; if(t&&isFinite(el.duration)&&!t.duration){t.duration=el.duration;render();} });
  el.addEventListener('timeupdate',()=>{ if(el!==media||seeking||!el.duration) return;
    const s=$('seek'); s.value=el.currentTime/el.duration*1000; setFill(s); $('cur').textContent=fmt(el.currentTime); });
  el.addEventListener('error',()=>{ if(el!==media||cur<0||!el.getAttribute('src')) return;
    toast(`Couldn't play "${tracks[cur].title}".${tracks[cur].link?' The link may be offline.':''}`,true); });
  el.addEventListener('click',togglePlay);
});
$('seek').oninput=e=>{seeking=true;setFill(e.target);if(media.duration)$('cur').textContent=fmt(e.target.value/1000*media.duration);};
$('seek').onchange=e=>{if(media.duration)media.currentTime=e.target.value/1000*media.duration;seeking=false;};
const vol=$('vol'); let lastVol=.8;
const setVol=v=>{vA.volume=vB.volume=v;vol.value=v*100;setFill(vol);try{localStorage.setItem('groove-vol',v)}catch(e){}};
vol.oninput=()=>setVol(vol.value/100);
const toggleMute=()=>{ if(vA.volume>0){lastVol=vA.volume;setVol(0);} else setVol(lastVol||.8); };
$('muteBtn').onclick=toggleMute;
try{const v=localStorage.getItem('groove-vol');setVol(v!==null?+v:.8)}catch(e){setVol(.8)}
function goFull(){ if(tracks[cur]?.kind!=='video') return; const el=media;
  (el.requestFullscreen||el.webkitEnterFullscreen||el.webkitRequestFullscreen)?.call(el)?.catch?.(()=>{}); }
$('fsBtn').onclick=goFull;

$('play').onclick=togglePlay; $('next').onclick=()=>step(1); $('prev').onclick=()=>step(-1);
$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').classList.toggle('on',shuffle);rebuildOrder();};
$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').classList.toggle('on',repeat>0);$('rep1').textContent=repeat===2?'1':'';};

function updateNow(){
  const t=tracks[cur]; if(!t) return;
  $('title').textContent=t.title;$('artist').textContent=t.artist;
  document.title=t.title+' — Groove';
  if('mediaSession' in navigator){try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Groove'});
    navigator.mediaSession.setActionHandler('play',togglePlay);
    navigator.mediaSession.setActionHandler('pause',togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
  }catch(e){}}
}

/* ---------- Library list ---------- */
const ICON_DL='<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
function render(){
  const q=$('search').value.trim().toLowerCase();
  const ul=$('list'); ul.innerHTML='';
  const nv=tracks.filter(t=>t.kind==='video').length;
  $('count').textContent=`${tracks.length} item${tracks.length===1?'':'s'}`+(nv?` · ${nv} video${nv===1?'':'s'}`:'');
  const shown=tracks.map((t,i)=>[t,i]).filter(([t])=>!q||(t.title+' '+t.artist).toLowerCase().includes(q));
  if(!shown.length){ul.innerHTML='<li class="empty">'+(tracks.length?'No matches':'Your library is empty. Add files or paste a link.')+'</li>';return;}
  shown.forEach(([t,i])=>{
    const li=document.createElement('li'); li.className='item'+(i===cur?' active':'');
    const tags=(t.kind==='video'?'<span class="tag">VIDEO</span>':'')+(t.link?'<span class="tag">ONLINE</span>':'');
    li.innerHTML=`<span class="num">${i===cur?'<span class="bars"><i></i><i></i><i></i></span>':i+1}</span>
      <div style="min-width:0"><div class="t"></div><div class="a">${tags}<span class="an"></span></div></div>
      <span class="dur">${t.duration?fmt(t.duration):''}</span>
      ${t.blob&&!t.demo?`<button class="act dl" title="Save to device">${ICON_DL}</button>`:'<span></span>'}
      <button class="act rm" title="Remove">×</button>`;
    li.querySelector('.t').textContent=t.title; li.querySelector('.an').textContent=t.artist;
    li.onclick=()=>i===cur?togglePlay():playIndex(i);
    li.querySelector('.rm').onclick=e=>{e.stopPropagation();removeTrack(i);};
    const dl=li.querySelector('.dl'); if(dl) dl.onclick=e=>{e.stopPropagation();saveToDevice(t);};
    ul.appendChild(li);
  });
}
function saveToDevice(t){
  if(!t.url) t.url=URL.createObjectURL(t.blob);
  const ext=(t.blob.name&&t.blob.name.match(/\.[^.]+$/)?.[0])||({'audio/mpeg':'.mp3','audio/mp4':'.m4a','audio/wav':'.wav','audio/ogg':'.ogg','video/mp4':'.mp4','video/webm':'.webm','audio/webm':'.webm','audio/flac':'.flac'}[t.blob.type]||'');
  const a=document.createElement('a'); a.href=t.url; a.download=(t.artist&&t.artist!=='Unknown artist'?t.artist+' - ':'')+t.title+ext;
  document.body.appendChild(a); a.click(); a.remove();
}
function removeTrack(i){
  const t=tracks[i];
  if(i===cur){media.pause();media.removeAttribute('src');media.load();cur=-1;$('art').classList.remove('isvideo');
    $('title').textContent='Nothing playing';$('artist').textContent='Pick something from your library';
    $('cur').textContent=$('dur').textContent='0:00';$('seek').value=0;setFill($('seek'));document.title='Groove — Music Player';}
  else if(i<cur) cur--;
  if(t.url&&t.blob) URL.revokeObjectURL(t.url);
  tracks.splice(i,1); if(!t.demo) dbDel(t.id); rebuildOrder(); render();
}
$('search').oninput=render;

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range') return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(Math.min(1,vA.volume+.05));}
  else if(e.key==='ArrowDown'){e.preventDefault();setVol(Math.max(0,vA.volume-.05));}
  else if(k==='s') $('shuffle').click();
  else if(k==='r') $('repeat').click();
  else if(k==='m') toggleMute();
  else if(k==='f') goFull();
});

/* ---------- Visualizer ---------- */
const cv=$('viz'),g=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;}
addEventListener('resize',resize); resize();
let tIdle=0;
function draw(){
  requestAnimationFrame(draw);
  if($('art').classList.contains('isvideo')) return;
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2; if(!W) {resize();return;}
  g.clearRect(0,0,W,H);
  const n=64; const vals=new Array(n).fill(0);
  if(analyser&&media===vA&&!vA.paused){analyser.getByteFrequencyData(data);for(let i=0;i<n;i++)vals[i]=data[Math.floor(i*data.length*0.75/n)]/255;}
  else{tIdle+=.02;const amp=media.paused?.05:.12;for(let i=0;i<n;i++)vals[i]=.08+amp*Math.sin(tIdle*(media.paused?1:3)+i*.4);}
  const R=Math.min(W,H)*.22,maxL=Math.min(W,H)*.24;
  const avg=vals.reduce((a,b)=>a+b,0)/n;
  const grad=g.createRadialGradient(cx,cy,R*.5,cx,cy,R+maxL*1.2);
  grad.addColorStop(0,`rgba(255,122,69,${.15+avg*.4})`);grad.addColorStop(1,'rgba(255,122,69,0)');
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.lineCap='round';g.lineWidth=Math.max(2,W/180);
  for(let i=0;i<n*2;i++){const v=vals[i<n?i:2*n-1-i],a=i/(n*2)*Math.PI*2-Math.PI/2,L=R+8+v*maxL;
    g.strokeStyle=`hsl(${18+v*30},100%,${55+v*15}%)`;
    g.beginPath();g.moveTo(cx+Math.cos(a)*(R+6),cy+Math.sin(a)*(R+6));g.lineTo(cx+Math.cos(a)*L,cy+Math.sin(a)*L);g.stroke();}
}
draw(); setFill($('seek'));

/* ---------- Start up: load saved library ---------- */
(async()=>{
  await openDB();
  const saved=(await dbAll())||[];
  saved.sort((a,b)=>a.added-b.added).forEach(r=>tracks.push({...r,url:r.link||null}));
  if(!tracks.length) demos.forEach((d,i)=>tracks.push({id:'demo'+i,title:d.title,artist:'Groove Demo',kind:'audio',added:0,demo:d.cfg,duration:0}));
  rebuildOrder(); render();
  if(saved.length) toast(`Welcome back. ${saved.length} item${saved.length===1?'':'s'} loaded from your library.`,false,3000);
})();
</script>
